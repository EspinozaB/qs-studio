name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DQS_BUILD_APP=OFF && cmake --build build -j && ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter "QS Studio.exe" | Select-Object -First 1 | Copy-Item -Destination out/
      - uses: actions/upload-artifact@v4
        with:
          name: QS-Studio-windows
          path: out/
