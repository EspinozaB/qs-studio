name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DQS_BUILD_APP=OFF && cmake --build build -j && ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter "QS Studio.exe" | Select-Object -First 1 | Copy-Item -Destination out/
      - uses: actions/upload-artifact@v4
        with:
          name: QS-Studio-windows
          path: out/
      - name: Publish to the "latest" prerelease (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "out/QS Studio.exe" "out/QS-Studio.exe"
          $cm = Get-Content CMakeLists.txt -Raw
          $ver = [regex]::Match($cm, 'project\(QSStudio VERSION ([0-9.]+)').Groups[1].Value
          $stage = [regex]::Match($cm, 'set\(QS_STAGE "([^"]*)"\)').Groups[1].Value
          $sha = $env:GITHUB_SHA.Substring(0,7)
          gh release delete latest --cleanup-tag -y 2>$null
          $notes = @"
          QS Studio $ver $stage, automatic build of main at $sha.

          $stage means things change often and some features are untested on hardware. Back up your synth (Backup & Restore) before writing anything to it.

          Put QS-Studio.exe in a folder of its own (Documents, Desktop or a USB stick; not Program Files). It keeps everything it saves in a "QS Studio Data" folder next to it. To update, replace the exe and keep that folder.

          Unofficial; not made or endorsed by Alesis or inMusic.
          "@
          gh release create latest "out/QS-Studio.exe" --prerelease --target $env:GITHUB_SHA --title "QS Studio $ver $stage ($sha)" --notes $notes
