name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DQS_BUILD_APP=OFF && cmake --build build -j && ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem build -Recurse -Filter "QS Studio.exe" | Select-Object -First 1 | Copy-Item -Destination out/
      - uses: actions/upload-artifact@v4
        with:
          name: QS-Studio-windows
          path: out/
      - name: Publish to the "latest" prerelease (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "out/QS Studio.exe" "out/QS-Studio.exe"
          gh release delete latest --cleanup-tag -y 2>$null
          $notes = "Automatic build of main at $($env:GITHUB_SHA.Substring(0,7)). Untested on hardware; use at your own risk."
          gh release create latest "out/QS-Studio.exe" --prerelease --target $env:GITHUB_SHA --title "QS Studio (latest build)" --notes $notes
